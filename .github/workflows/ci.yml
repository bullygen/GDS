# Проверки ядра, Python-пакета и всех учебных сценариев после публикации.
name: Проверки библиотеки
on: [push, pull_request]
jobs:
  cpp:
    name: Самостоятельное ядро C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  python:
    name: Интерфейс Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test,plot]"
      - run: python -m pytest -q
      - name: Учебные сценарии
        run: |
          for script in tutorials/*.py; do
            python "$script"
          done
  distribution:
    name: Исходный и двоичный дистрибутивы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python tests/check_distribution.py
  hackathon:
    name: Планировщик Cosmo B и физика C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r hackathon/solver/requirements.txt
      - run: python hackathon/solver/run.py build
      - run: python -m pytest hackathon/solver/test_solver.py -q
